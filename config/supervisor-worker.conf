[program:media-panel-worker]
command=/usr/bin/php /opt/licensed-media-panel/scripts/run-worker.php
directory=/opt/licensed-media-panel
user=media-panel
numprocs=2
process_name=%(program_name)s_%(process_num)02d
autostart=true
autorestart=true
startsecs=3
stopwaitsecs=60
redirect_stderr=true
stdout_logfile=/opt/licensed-media-panel/storage/logs/worker.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
environment=APP_ENV="production"
