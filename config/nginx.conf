limit_req_zone $binary_remote_addr zone=panel_api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=panel_web:20m rate=300r/s;
limit_req_zone $binary_remote_addr zone=panel_auth:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=panel_conn:10m;
server {
    listen 80;
    server_name _;
    root /opt/licensed-media-panel/public;
    index index.php;
    autoindex off;
    server_tokens off;
    client_max_body_size 5g;
    limit_req_status 429;
    limit_conn_status 429;
    include /etc/nginx/orionx-blocked-ips.conf;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.tailwindcss.com https://cdn.jsdelivr.net https://unpkg.com 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://image.tmdb.org; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    location /api/ { limit_req zone=panel_api burst=60 nodelay; limit_conn panel_conn 30; try_files $uri /index.php?$query_string; }
    location = /login { limit_req zone=panel_auth burst=10 nodelay; try_files $uri /index.php?$query_string; }
    location / { limit_req zone=panel_web burst=600 nodelay; limit_conn panel_conn 100; try_files $uri $uri/ /index.php?$query_string; }
    location = /index.php { include snippets/fastcgi-php.conf; fastcgi_pass unix:/run/php/php__PHP_VERSION__-fpm.sock; fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name; }
    location ~ \.php$ { return 404; }
    location ~ /\. { deny all; }
    location ~* \.(env|sql|log|bak|ini)$ { deny all; }
    include /etc/nginx/media-libraries.d/*.conf;
}
